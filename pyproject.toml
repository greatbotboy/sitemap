[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemapgen"
version = "0.1.0"
description = "Generate Sitemaps protocol XML, sitemap indexes, and text URL lists."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "greatbotboy" }]
keywords = ["sitemap", "seo", "crawler", "robots.txt"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/greatbotboy/sitemap"
Repository = "https://github.com/greatbotboy/sitemap"
Issues = "https://github.com/greatbotboy/sitemap/issues"
Changelog = "https://github.com/greatbotboy/sitemap/releases"

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
sitemapgen = "sitemapgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
